databases:
  - name: nitro-postgres-db
    plan: free
    databaseName: nitro_db
    user: nitro_user

services:
  - type: web
    name: nitro-shopify-visitor-intelligence
    env: node
    plan: free
    buildCommand: "npm install --include=dev && npx prisma db push && npm run build"
    startCommand: "npm run start"
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: nitro-postgres-db
          property: connectionString
      - key: SCOPES
        value: "read_customers,read_orders,read_products"
      - key: ENCRYPTION_SECRET
        generateValue: true
      - key: SHOPIFY_API_KEY
        sync: false
      - key: SHOPIFY_API_SECRET
        sync: false
      - key: SHOPIFY_APP_URL
        sync: false
