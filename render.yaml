services:
  - type: web
    name: nitro-shopify-visitor-intelligence
    env: node
    plan: free
    buildCommand: "npx prisma db push && npm run build"
    startCommand: "npm run start"
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        value: "file:./dev.db"
      - key: SCOPES
        value: "read_customers,read_orders,read_products"
      - key: ENCRYPTION_SECRET
        generateValue: true
      - key: SHOPIFY_API_KEY
        sync: false
      - key: SHOPIFY_API_SECRET
        sync: false
      - key: SHOPIFY_APP_URL
        sync: false
